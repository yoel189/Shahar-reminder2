            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

        // Generates a random timestamp later today (between 09:30 and 21:30, or later if already past)
        function generateRandomTimestampToday(isSnooze = false) {
            const now = new Date();
            const nowMs = now.getTime();

            if (isSnooze) {
                // Reschedule randomly between 25 and 90 minutes from now (capped at 22:45 tonight)
                const minDelayMs = 25 * 60 * 1000;

                const randomDelay = Math.floor(Math.random() * (maxDelayMs - minDelayMs + 1)) + minDelayMs;
                
                const endOfEvening = new Date(now);
                endOfEvening.setHours(22, 45, 0, 0);
                
                const proposed = nowMs + randomDelay;
                return proposed < endOfEvening.getTime() ? proposed : nowMs + (15 * 60 * 1000);

            startWindow.setHours(9, 30, 0, 0);

            const endWindow = new Date(now);

            // If user opens the app after 21:30 for the first time today, schedule within 10-45 mins
            if (nowMs >= endWindow.getTime()) {
                const fallbackDelay = (Math.floor(Math.random() * 35) + 10) * 60 * 1000;
                return nowMs + fallbackDelay;
            }

            // Ensure the random time is in the future relative to right now
            const effectiveStart = Math.max(nowMs + (5 * 60 * 1000), startWindow.getTime());
            const effectiveEnd = Math.max(effectiveStart + (15 * 60 * 1000), endWindow.getTime());

            return Math.floor(Math.random() * (effectiveEnd - effectiveStart + 1)) + effectiveStart;
